<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <!--
        Spring Security maneja el POST /validar automaticamente (loginProcessingUrl).
        El controlador LoginController solo muestra esta pagina (GET /login).
        Los campos DEBEN llamarse "username" y "password" (nombres por defecto de Spring Security).
    -->
    <form th:action="@{/validar}" method="post" class="login-form">

        <!-- Token CSRF: Thymeleaf lo agrega automaticamente con th:action -->

        <!-- Error de credenciales: Spring Security redirige a /login?error=true -->
        <div th:if="${param.error}" style="color: red; margin-bottom: 10px;">
            <span>Usuario o contraseña incorrectos. Intente de nuevo.</span>
        </div>

        <!-- Mensaje de logout exitoso: /login?logout=true -->
        <div th:if="${param.logout}" style="color: green; margin-bottom: 10px;">
            <span>Sesión cerrada correctamente.</span>
        </div>

        <div class="form-group">
            <label for="username">Usuario:</label>
            <!-- Spring Security espera el campo "username" por defecto -->
            <input type="text" id="username" name="username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <!-- Spring Security espera el campo "password" por defecto -->
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>
</body>
</html>
