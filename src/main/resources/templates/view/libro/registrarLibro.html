<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{pattern/head :: head}">
    <title>Registrar Libro</title>
</head>
<body class="bg-zinc-50 font-sans text-zinc-900 antialiased selection:bg-zinc-900 selection:text-white">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <!-- Encabezado de la página -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-zinc-200">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-zinc-900">Registrar Libro</h1>
                <p class="text-xs text-zinc-500 mt-1">Completa los campos para ingresar un nuevo libro al catálogo de la biblioteca.</p>
            </div>
            <a th:href="@{/dashboard}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-100 text-zinc-700 text-xs font-medium hover:bg-zinc-200 transition-colors">
                ← Volver al Dashboard
            </a>
        </div>

        <!-- Formulario de Registro Minimalista -->
        <div class="bg-white rounded-xl border border-zinc-200/80 shadow-xs p-6 sm:p-8 max-w-4xl">
            <form th:action="@{/Libros/registrar}" method="post" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex items-center gap-2">
                        <span class="w-1 h-4 rounded-full bg-blue-500"></span>
                        <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Información del Libro</h2>
                    </div>
                    <!-- Título -->
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-2" for="titulo">
                            Título del Libro <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="titulo" name="titulo" required
                               placeholder="Ej. Cien Años de Soledad"
                               class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
                    </div>

                    <!-- ISBN -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-2" for="isbn">
                            ISBN / Código <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="isbn" name="isbn" required
                               placeholder="978-0307474728"
                               class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
                    </div>

                    <!-- Año de Publicación -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-2" for="anioPublicacion">
                            Año de Publicación
                        </label>
                        <input type="number" id="anioPublicacion" name="anioPublicacion" min="1500" max="2099"
                               placeholder="1967"
                               class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
                    </div>

                    <!-- Autor -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-2" for="autor">
                            Autor Principal
                        </label>
                        <select id="autor" name="autorId" class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                            <option value="">Selecciona un autor...</option>
                            <option value="1">Gabriel García Márquez</option>
                            <option value="2">Jorge Luis Borges</option>
                            <option value="3">Miguel de Cervantes</option>
                            <option value="4">Mario Vargas Llosa</option>
                        </select>
                    </div>

                    <!-- Categoría -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-2" for="categoria">
                            Categoría
                        </label>
                        <select id="categoria" name="categoriaId" class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                            <option value="">Selecciona una categoría...</option>
                            <option value="1">Novela</option>
                            <option value="2">Ciencia Ficción</option>
                            <option value="3">Historia</option>
                            <option value="4">Filosofía</option>
                            <option value="5">Poesía</option>
                        </select>
                    </div>

                    <!-- Número de Páginas -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-2" for="numPaginas">
                            Número de Páginas
                        </label>
                        <input type="number" id="numPaginas" name="numPaginas" min="1"
                               placeholder="Ej. 471"
                               class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
                    </div>

                    <!-- Idioma -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-2" for="idioma">
                            Idioma
                        </label>
                        <input type="text" id="idioma" name="idioma" value="Español"
                               class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
                    </div>

                    <!-- Sinopsis / Descripción -->
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-2" for="sinopsis">
                            Sinopsis
                        </label>
                        <textarea id="sinopsis" name="sinopsis" rows="4"
                                  placeholder="Escribe una breve descripción o resumen del libro..."
                                  class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"></textarea>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-zinc-100">
                    <a th:href="@{/dashboard}" class="px-4 py-2.5 rounded-lg border border-red-200 text-xs font-medium text-red-600 hover:bg-red-50 transition-colors">
                        Cancelar
                    </a>
                    <button type="submit" class="px-5 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition-colors shadow-xs">
                        Guardar Libro
                    </button>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
