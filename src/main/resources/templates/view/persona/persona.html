<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{pattern/head :: head}">
    <title>Registrar Persona</title>
</head>

<body class="bg-zinc-50 font-sans text-zinc-900 antialiased selection:bg-zinc-900 selection:text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Encabezado de la página -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-zinc-200">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-zinc-900">Registrar Persona</h1>
                <p class="text-xs text-zinc-500 mt-1">Completa los campos para registrar una nueva persona.</p>
            </div>
            <div class="flex items-center gap-3">
                <a th:href="@{/Personas/Listar}"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-100 text-zinc-700 text-xs font-medium hover:bg-zinc-200 transition-colors">
                    ← Volver a la Lista
                </a>
                <!-- Fragmento Toast Reutilizable -->
                <div th:replace="~{pattern/toast :: toast}"></div>
            </div>
        </div>

        <!-- Formulario -->
        <div class="bg-white rounded-xl border border-zinc-200/80 shadow-xs p-6 sm:p-8 max-w-4xl">
            <form th:action="@{/Personas}" th:object="${persona}" method="post" class="space-y-6">
                <!-- Token CSRF explícito para Spring Security -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

                    <!-- ── Sección: Datos de Identificación ── -->
                    <div class="md:col-span-3 flex items-center gap-2">
                        <span class="w-1 h-4 rounded-full bg-blue-500"></span>
                        <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Datos de Identificación</h2>
                    </div>

                    <!-- DNI -->
                    <div>
                        <label for="dni" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">
                            DNI <span class="text-red-500">*</span>
                        </label>
                        <input type="text" th:field="*{dni}" id="dni"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            maxlength="8" placeholder="Ej. 74217144" onkeydown="return Enter(this,event);">
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('dni')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{dni}"></span>
                        </div>
                    </div>

                    <!-- Nombre -->
                    <div>
                        <label for="nombre" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">
                            Nombre <span class="text-red-500">*</span>
                        </label>
                        <input type="text" th:field="*{nombre}" id="nombre"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            maxlength="50" placeholder="Ej. Luis" onkeydown="return Enter(this,event);">
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('nombre')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{nombre}"></span>
                        </div>
                    </div>

                    <!-- Fecha de Nacimiento -->
                    <div>
                        <label for="fechaNacimiento" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Fecha de Nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" id="fechaNacimiento"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('fechaNacimiento')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{fechaNacimiento}"></span>
                        </div>
                    </div>

                    <!-- Apellido Paterno -->
                    <div>
                        <label for="apellidoPaterno" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Apellido Paterno</label>
                        <input type="text" th:field="*{apellidoPaterno}" id="apellidoPaterno"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            maxlength="50" placeholder="Ej. Quispe" onkeydown="return Enter(this,event);">
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('apellidoPaterno')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{apellidoPaterno}"></span>
                        </div>
                    </div>

                    <!-- Apellido Materno -->
                    <div>
                        <label for="apellidoMaterno" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Apellido Materno</label>
                        <input type="text" th:field="*{apellidoMaterno}" id="apellidoMaterno"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            maxlength="50" placeholder="Ej. Pérez" onkeydown="return Enter(this,event);">
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('apellidoMaterno')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{apellidoMaterno}"></span>
                        </div>
                    </div>

                    <!-- Sexo -->
                    <div>
                        <label for="sexo" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Sexo</label>
                        <input type="text" th:field="*{sexo}" id="sexo"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            maxlength="1" placeholder="M / F" onkeydown="return Enter(this,event);">
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('sexo')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{sexo}"></span>
                        </div>
                    </div>

                    <!-- ── Sección: Datos de Contacto ── -->
                    <div class="md:col-span-3 flex items-center gap-2 pt-2 border-t border-zinc-100">
                        <span class="w-1 h-4 rounded-full bg-emerald-500"></span>
                        <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Datos de Contacto</h2>
                    </div>

                    <!-- Correo -->
                    <div class="md:col-span-2">
                        <label for="correo" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
                        <input type="email" th:field="*{correo}" id="correo"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            maxlength="30" placeholder="Ej. abc@email.com" onkeydown="return Enter(this,event);">
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('correo')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{correo}"></span>
                        </div>
                    </div>

                    <!-- Teléfono -->
                    <div>
                        <label for="telefono" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Teléfono</label>
                        <input type="text" th:field="*{telefono}" id="telefono"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            maxlength="9" placeholder="Ej. 987654321" onkeydown="return Enter(this,event);">
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('telefono')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{telefono}"></span>
                        </div>
                    </div>

                    <!-- Dirección -->
                    <div class="md:col-span-2">
                        <label for="direccion" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Dirección</label>
                        <input type="text" th:field="*{direccion}" id="direccion"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                            maxlength="100" placeholder="Ej. Av. Los Heroes 123" onkeydown="return Enter(this,event);">
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('direccion')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{direccion}"></span>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div>
                        <label for="estado" class="block text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-1.5">Estado</label>
                        <select th:field="*{estado}" id="estado"
                            class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all appearance-none pr-8">
                            <option value="" disabled th:selected="${persona.estado == null}">Seleccionar estado</option>
                            <option th:each="estado : ${listaEstado}" th:value="${estado}" th:text="${estado.descripcion}"></option>
                        </select>
                        <div class="text-xs text-red-500 mt-1 flex items-center gap-1" th:if="${#fields.hasErrors('estado')}">
                            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                            <span th:errors="*{estado}"></span>
                        </div>
                    </div>

                </div>

                <!-- Botones -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-zinc-100">
                    <a th:href="@{/Personas/Listar}"
                        class="px-4 py-2.5 rounded-lg border border-red-200 text-xs font-medium text-red-600 hover:bg-red-50 transition-colors">
                        Cancelar
                    </a>
                    <button type="submit" name="addPersona"
                        class="px-5 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition-colors shadow-xs">
                        Agregar Persona
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
