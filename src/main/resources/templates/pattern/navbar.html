<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Fragment</title>
</head>
<body>
    <!-- Navbar Minimalista con Menú Dinámico desde BD y Logout Seguro CSRF -->
    <nav th:fragment="navbar" class="sticky top-0 z-50 w-full bg-white/80 backdrop-blur-md border-b border-zinc-200/80 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            
            <!-- Izquierda: Marca y Menú de Navegación Dinámico -->
            <div class="flex items-center gap-8">
                <!-- Logotipo Minimalista -->
                <a th:href="@{/dashboard}" target="mainFrame" class="flex items-center gap-2.5 group">
                    <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-xs transition-transform group-hover:scale-105">
                        B
                    </div>
                    <span class="font-bold text-base tracking-tight text-zinc-900">
                        Biblioteca<span class="text-blue-600 font-normal">OS</span>
                    </span>
                </a>

                <!-- Enlaces Dinámicos de BD según Permisos Granulares -->
                <div class="hidden md:flex items-center gap-1 nav-links">
                    <th:block th:each="modulo : ${menuModulos}">
                        <a th:if="${modulo.puedeLeer}"
                           th:href="@{${modulo.ruta}}"
                           target="mainFrame"
                           class="nav-item px-3 py-1.5 rounded-lg text-sm font-medium text-zinc-700 hover:text-zinc-900 hover:bg-zinc-100/80 transition-colors flex items-center gap-1.5">
                            <i th:if="${modulo.icono}" th:class="${modulo.icono}"></i>
                            <span th:text="${modulo.nombre}">Módulo</span>
                        </a>
                    </th:block>
                </div>
            </div>

            <!-- Derecha: Buscador, Usuario y Logout -->
            <div class="flex items-center gap-3">
                <!-- Buscador Minimalista -->
                <div class="relative hidden sm:block">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" placeholder="Buscar..." class="w-48 lg:w-64 pl-9 pr-3 py-1.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-zinc-800 placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900 transition-all" />
                </div>

                <!-- Divisor -->
                <div class="h-5 w-[1px] bg-zinc-200 hidden sm:block"></div>

                <!-- Menú Usuario -->
                <div class="dropdown dropdown-end">
                    <div tabindex="0" role="button" class="flex items-center gap-2 p-1 rounded-lg hover:bg-zinc-100 cursor-pointer transition-colors">
                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-800 flex items-center justify-center font-bold text-xs border border-blue-200">
                            US
                        </div>
                    </div>
                    <ul tabindex="0" class="dropdown-content z-1 menu p-1.5 shadow-xl bg-white border border-zinc-200 rounded-xl w-52 text-sm mt-2">
                        <li class="px-3 py-2 border-b border-zinc-100 mb-1">
                            <span class="text-xs font-semibold text-zinc-900" sec:authentication="name">Usuario</span>
                            <span class="text-[11px] text-zinc-500 -mt-1 font-mono">JWT Autenticado</span>
                        </li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post" class="w-full">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="w-full text-left py-2 px-3 text-red-600 hover:bg-red-50 rounded-lg flex items-center gap-2 transition-colors font-medium">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                    </svg>
                                    Cerrar sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>
</body>
</html>
