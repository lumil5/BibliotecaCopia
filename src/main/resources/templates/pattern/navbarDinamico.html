<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Fragment</title>
</head>
<body>
    <!-- Sidebar vertical con enlaces apuntando a target="mainFrame" -->
    <nav th:fragment="navbar" class="flex h-full w-full flex-col bg-white border-r border-zinc-200/80">

        <!-- Marca -->
        <div class="flex h-16 shrink-0 items-center border-b border-zinc-100 px-2 md:px-5">
            <a th:href="@{/dashboard}" target="mainFrame" class="flex items-center gap-2.5 group">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-blue-600 text-sm font-bold text-white shadow-xs transition-transform group-hover:scale-105">
                    B
                </div>
                <span class="hidden font-bold text-base tracking-tight text-zinc-900 md:inline">
                    Biblioteca<span class="font-normal text-zinc-400">OS</span>
                </span>
            </a>
        </div>

        <!-- Navegación vertical -->
        <div class="flex-1 space-y-1 overflow-y-auto px-2 py-4 md:px-3">
            <p class="hidden px-3 pb-2 text-[10px] font-semibold uppercase tracking-wider text-zinc-400 md:block">
                Menú
            </p>

            <a
                th:href="@{/dashboard}"
                th:each="rol:${privilegio}"
                th:if="${rol.nombrePrivilegio == 'dashboard'}"
                target="mainFrame"
                title="Dashboard"
                class="flex items-center justify-center gap-3 rounded-lg bg-zinc-100 px-3 py-2 text-sm font-medium text-zinc-900 transition-colors hover:bg-zinc-200/70 md:justify-start">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
                <span class="hidden md:inline">Dashboard</span>
            </a>

            <a
                th:href="@{/Libros/registrar}"
                th:each="rol:${privilegio}"
                th:if="${rol.nombrePrivilegio == 'Libros'}"
                target="mainFrame"
                title="Libros"
                class="flex items-center justify-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-zinc-600 transition-colors hover:bg-zinc-100/60 hover:text-zinc-900 md:justify-start">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                </svg>
                <span class="hidden md:inline">Libros</span>
            </a>

            <a
                th:href="@{/autores}"
                th:each="rol:${privilegio}"
                th:if="${rol.nombrePrivilegio == 'autores'}"
                target="mainFrame"
                title="Autores"
                class="flex items-center justify-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-zinc-600 transition-colors hover:bg-zinc-100/60 hover:text-zinc-900 md:justify-start">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                </svg>
                <span class="hidden md:inline">Autores</span>
            </a>

            <a
                th:href="@{/categorias}"
                th:each="rol:${privilegio}"
                th:if="${rol.nombrePrivilegio == 'categorias'}"
                target="mainFrame"
                title="Categorías"
                class="flex items-center justify-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-zinc-600 transition-colors hover:bg-zinc-100/60 hover:text-zinc-900 md:justify-start">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z" />
                </svg>
                <span class="hidden md:inline">Categorías</span>
            </a>

            <!-- Administración: submenú lateral -->
            <div class="dropdown dropdown-right dropdown-hover w-full">
                <div tabindex="0" role="button" title="Administración" class="flex w-full cursor-pointer items-center justify-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-zinc-600 transition-colors hover:bg-zinc-100/60 hover:text-zinc-900 md:justify-start">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="hidden md:inline">Administración</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="ml-auto hidden h-3.5 w-3.5 -rotate-90 opacity-60 md:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                    </svg>
                </div>
                <ul tabindex="0" class="dropdown-content z-50 menu ml-2 w-48 rounded-xl border border-zinc-200 bg-white p-1.5 text-sm shadow-xl">
                    <li>
                        <a
                            th:href="@{${rol.url}}"
                            target="mainFrame"
                            th:each="rol:${privilegio}"
                            th:if="${rol.nombrePrivilegio == 'Personas'}"
                            class="rounded-lg py-2 text-zinc-700 hover:text-zinc-900">
                            Personas
                        </a>
                    </li>
                    <li>
                        <a
                            th:href="@{/ejemplares}"
                            target="mainFrame"
                            th:each="rol:${privilegio}"
                            th:if="${rol.nombrePrivilegio == 'Personas'}"
                            class="rounded-lg py-2 text-zinc-700 hover:text-zinc-900">
                            Clientes
                        </a>
                    </li>
                    <li>
                        <a
                            th:href="@{/ejemplares}"
                            target="mainFrame"
                            class="rounded-lg py-2 text-zinc-700 hover:text-zinc-900">
                            Empleados
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Pie del sidebar: buscador, notificaciones y usuario -->
        <div class="shrink-0 space-y-2 border-t border-zinc-100 p-2 md:p-3">

            <!-- Buscador -->
            <div class="relative hidden md:block">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-zinc-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input type="text" placeholder="Buscar..." class="w-full rounded-lg border border-zinc-200 bg-zinc-50 py-1.5 pl-9 pr-3 text-sm text-zinc-800 placeholder-zinc-400 transition-all focus:border-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900" />
            </div>

            <!-- Notificaciones -->
            <button class="relative flex w-full items-center justify-center gap-3 rounded-lg p-2 text-zinc-500 transition-colors hover:bg-zinc-100 hover:text-zinc-900 md:justify-start" aria-label="Notificaciones" title="Notificaciones">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                </svg>
                <span class="hidden text-sm font-medium md:inline">Notificaciones</span>
                <span class="absolute right-1 top-1 h-2 w-2 rounded-full bg-red-500 md:left-6 md:right-auto"></span>
            </button>

            <!-- Menú Usuario -->
            <div class="dropdown dropdown-top w-full">
                <div tabindex="0" role="button" title="Cuenta" class="flex w-full cursor-pointer items-center justify-center gap-3 rounded-lg p-2 transition-colors hover:bg-zinc-100 md:justify-start">
                    <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-zinc-300 bg-zinc-200 text-xs font-semibold text-zinc-800">
                        AD
                    </div>
                    <div class="hidden min-w-0 md:block">
                        <p class="truncate text-xs font-semibold text-zinc-900">Admin</p>
                        <p class="truncate text-[11px] text-zinc-400">admin@biblioteca.org</p>
                    </div>
                </div>
                <ul tabindex="0" class="dropdown-content menu z-50 mb-2 w-56 rounded-xl border border-zinc-200 bg-white p-1.5 text-sm shadow-xl">
                    <li class="mb-1 border-b border-zinc-100 px-3 py-1.5">
                        <span class="text-xs font-semibold text-zinc-900">Admin</span>
                        <span class="-mt-1 text-[11px] text-zinc-400">admin@biblioteca.org</span>
                    </li>
                    <li><a th:href="@{/perfil}" target="mainFrame" class="rounded-lg py-2 text-zinc-700 hover:text-zinc-900">Perfil</a></li>
                    <li><a th:href="@{/configuracion}" target="mainFrame" class="rounded-lg py-2 text-zinc-700 hover:text-zinc-900">Ajustes</a></li>
                    <div class="divider my-0.5"></div>
                    <li><a th:href="@{/logout}" class="rounded-lg py-2 text-red-600 hover:bg-red-50">Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
